<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checklist - Mecânica Brasil</title>
    <style>
        :root {
            --bg: #f1f5f9;
            --card: #ffffff;
            --text: #1e293b;
            --muted: #64748b;
            --border: #e2e8f0;
            --green: #22c55e;
            --yellow: #eab308;
            --red: #ef4444;
            --blue: #3b82f6;
            --whatsapp: #25D366;
            --radius: 12px;
            --shadow: 0 1px 3px rgba(0,0,0,.08), 0 1px 2px rgba(0,0,0,.06);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.5;
            padding-bottom: 40px;
        }
        .container { max-width: 720px; margin: 0 auto; padding: 12px 16px; }

        /* Header */
        .header {
            background: linear-gradient(135deg, #1e3a5f 0%, #0f2440 100%);
            color: #fff;
            padding: 18px 16px;
            text-align: center;
            border-radius: 0 0 var(--radius) var(--radius);
            margin-bottom: 16px;
            box-shadow: 0 4px 12px rgba(0,0,0,.15);
        }
        .header h1 { font-size: 22px; letter-spacing: -.3px; }
        .header span { font-size: 13px; opacity: .75; }

        /* Cards */
        .card {
            background: var(--card);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            padding: 16px;
            margin-bottom: 14px;
            border: 1px solid var(--border);
        }
        .card h2 {
            font-size: 16px;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
            color: #1e3a5f;
        }
        .card h3 {
            font-size: 14px;
            margin-bottom: 10px;
            color: #334155;
            border-bottom: 1px solid var(--border);
            padding-bottom: 8px;
        }

        /* Form */
        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 10px;
        }
        .form-row.col3 { grid-template-columns: 1fr 1fr 1fr; }
        .form-group { display: flex; flex-direction: column; gap: 4px; }
        .form-group label { font-size: 12px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .3px; }
        .form-group input {
            padding: 10px 12px;
            border: 1.5px solid var(--border);
            border-radius: 8px;
            font-size: 14px;
            transition: border-color .2s;
            background: #f8fafc;
        }
        .form-group input:focus {
            outline: none;
            border-color: var(--blue);
            box-shadow: 0 0 0 3px rgba(59,130,246,.1);
            background: #fff;
        }

        /* Itens do checklist */
        .category-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            cursor: pointer;
            padding: 10px 12px;
            background: #f8fafc;
            border-radius: 8px;
            margin-bottom: 6px;
            border: 1px solid var(--border);
            transition: background .2s;
        }
        .category-header:hover { background: #f1f5f9; }
        .category-header .arrow { transition: transform .2s; font-size: 12px; }
        .category-header.open .arrow { transform: rotate(180deg); }

        .items-container { display: none; padding: 4px 0 10px 0; }
        .items-container.show { display: block; }

        .checklist-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 12px;
            border-bottom: 1px solid #f1f5f9;
            flex-wrap: wrap;
        }
        .checklist-item:last-child { border-bottom: none; }
        .item-label {
            flex: 1;
            min-width: 140px;
            font-size: 14px;
            font-weight: 500;
        }
        .status-btns {
            display: flex;
            gap: 4px;
            flex-shrink: 0;
        }
        .status-btn {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            border: 2px solid transparent;
            cursor: pointer;
            font-size: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f1f5f9;
            transition: all .2s;
        }
        .status-btn:hover { transform: scale(1.1); }
        .status-btn.ok { color: var(--green); }
        .status-btn.ok.active { background: #dcfce7; border-color: var(--green); }
        .status-btn.repair { color: var(--yellow); }
        .status-btn.repair.active { background: #fef9c3; border-color: var(--yellow); }
        .status-btn.critical { color: var(--red); }
        .status-btn.critical.active { background: #fee2e2; border-color: var(--red); }

        .item-obs {
            width: 100%;
            margin-top: 6px;
            padding: 6px 10px;
            border: 1px solid var(--border);
            border-radius: 6px;
            font-size: 12px;
            background: #fafafa;
        }
        .item-media {
            display: flex;
            gap: 6px;
            margin-top: 6px;
            flex-wrap: wrap;
            align-items: center;
        }
        .media-btn {
            font-size: 11px;
            padding: 6px 10px;
            border-radius: 20px;
            border: 1px solid var(--border);
            background: #fff;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 4px;
            transition: all .2s;
            color: var(--muted);
        }
        .media-btn:hover { background: #f1f5f9; }
        .media-thumb {
            width: 48px;
            height: 48px;
            border-radius: 6px;
            object-fit: cover;
            border: 1px solid var(--border);
            cursor: pointer;
        }
        .media-thumb.audio-thumb {
            background: #ede9fe;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            width: 48px;
            height: 48px;
        }

        /* Botões gerais */
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            padding: 12px 20px;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 600;
            border: none;
            cursor: pointer;
            transition: all .2s;
            text-decoration: none;
        }
        .btn:active { transform: scale(.97); }
        .btn-primary { background: var(--blue); color: #fff; width: 100%; }
        .btn-primary:hover { background: #2563eb; }
        .btn-whatsapp { background: var(--whatsapp); color: #fff; }
        .btn-whatsapp:hover { background: #1ebe5d; }
        .btn-secondary { background: #e2e8f0; color: #1e293b; }
        .btn-secondary:hover { background: #cbd5e1; }
        .btn-danger { background: #fee2e2; color: #dc2626; }
        .btn-danger:hover { background: #fecaca; }
        .btn-sm { padding: 6px 12px; font-size: 12px; }
        .btn-icon { width: 36px; height: 36px; padding: 0; border-radius: 50%; }

        .btn-row { display: flex; gap: 8px; flex-wrap: wrap; }
        .btn-row .btn { flex: 1; min-width: 100px; }

        /* Toast */
        .toast {
            position: fixed;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%);
            background: #1e293b;
            color: #fff;
            padding: 12px 24px;
            border-radius: 30px;
            font-size: 14px;
            z-index: 9999;
            opacity: 0;
            transition: opacity .3s;
            pointer-events: none;
            box-shadow: 0 8px 24px rgba(0,0,0,.2);
        }
        .toast.show { opacity: 1; }

        /* Modal */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,.5);
            z-index: 1000;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 16px;
        }
        .modal-overlay.show {
            display: flex;
        }
        .modal {
            background: #fff;
            border-radius: var(--radius);
            width: 100%;
            max-width: 600px;
            max-height: 85vh;
            overflow-y: auto;
            box-shadow: 0 20px 60px rgba(0,0,0,.2);
        }
        .modal-header {
            padding: 14px 18px;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            background: #fff;
            z-index: 1;
            border-radius: var(--radius) var(--radius) 0 0;
        }
        .modal-header h2 { font-size: 17px; }
        .modal-close {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            border: none;
            background: #f1f5f9;
            cursor: pointer;
            font-size: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .modal-close:hover { background: #e2e8f0; }
        .modal-body { padding: 16px 18px; }
        .modal-footer {
            padding: 14px 18px;
            border-top: 1px solid var(--border);
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            position: sticky;
            bottom: 0;
            background: #fff;
            border-radius: 0 0 var(--radius) var(--radius);
        }

        /* Relatório */
        .report-preview {
            background: #f8fafc;
            border-radius: 8px;
            padding: 14px;
            white-space: pre-wrap;
            font-family: 'SF Mono', 'Fira Code', 'Consolas', monospace;
            font-size: 13px;
            line-height: 1.6;
            max-height: 400px;
            overflow-y: auto;
            border: 1px solid var(--border);
        }
        .classification-badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 700;
        }
        .classification-badge.green { background: #dcfce7; color: #166534; }
        .classification-badge.yellow { background: #fef9c3; color: #854d0e; }
        .classification-badge.red { background: #fee2e2; color: #991b1b; }

        .no-scroll { overflow: hidden; }

        /* Responsivo */
        @media (max-width: 480px) {
            .form-row, .form-row.col3 { grid-template-columns: 1fr; }
            .checklist-item { flex-direction: column; align-items: flex-start; }
            .status-btns { align-self: flex-end; }
        }

        /* Scrollbar */
        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 20px; }

        /* Animação de spinner */
        @keyframes spin { to { transform: rotate(360deg); } }
        .spinner {
            width: 18px;
            height: 18px;
            border: 2px solid #fff;
            border-top-color: transparent;
            border-radius: 50%;
            animation: spin .6s linear infinite;
            display: inline-block;
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>🔧 Checklist Mecânica Brasil</h1>
        <span>Inspeção veicular completa</span>
    </div>

    <div class="container">

        <!-- Dados do Cliente/Veículo -->
        <div class="card">
            <h2>📋 Dados da Inspeção</h2>
            <div class="form-row">
                <div class="form-group">
                    <label>Cliente</label>
                    <input type="text" id="cliente" placeholder="Nome do cliente">
                </div>
                <div class="form-group">
                    <label>Veículo</label>
                    <input type="text" id="veiculo" placeholder="Modelo do veículo">
                </div>
            </div>
            <div class="form-row col3">
                <div class="form-group">
                    <label>Placa</label>
                    <input type="text" id="placa" placeholder="ABC-1234">
                </div>
                <div class="form-group">
                    <label>KM Atual</label>
                    <input type="text" id="km" placeholder="000.000">
                </div>
                <div class="form-group">
                    <label>Data</label>
                    <input type="date" id="data">
                </div>
            </div>
        </div>

        <!-- Checklist -->
        <div class="card">
            <h2>✅ Itens de Inspeção</h2>
            <div id="categoriesContainer"></div>
        </div>

        <!-- Observações Gerais -->
        <div class="card">
            <h2>📝 Observações Gerais</h2>
            <textarea id="generalObs" rows="3" placeholder="Observações adicionais sobre o veículo..."
                style="width:100%;padding:10px;border:1px solid var(--border);border-radius:8px;font-family:inherit;font-size:14px;resize:vertical;"></textarea>
        </div>

        <!-- Botão Gerar Relatório -->
        <button class="btn btn-primary" onclick="generateReport()" style="margin-bottom:20px;">
            📊 Gerar Relatório Completo
        </button>

    </div>

    <!-- Modal do Relatório -->
    <div class="modal-overlay" id="reportModal">
        <div class="modal">
            <div class="modal-header">
                <h2>📊 Relatório de Inspeção</h2>
                <button class="modal-close" onclick="closeModal('reportModal')">✕</button>
            </div>
            <div class="modal-body" id="reportBody"></div>
            <div class="modal-footer" id="reportFooter"></div>
        </div>
    </div>

    <!-- Modal de Prévia WhatsApp -->
    <div class="modal-overlay" id="whatsappPreviewModal">
        <div class="modal">
            <div class="modal-header">
                <h2>📱 Enviar pelo WhatsApp</h2>
                <button class="modal-close" onclick="closeModal('whatsappPreviewModal')">✕</button>
            </div>
            <div class="modal-body" id="whatsappPreviewContent"></div>
        </div>
    </div>

    <!-- Toast -->
    <div class="toast" id="toast"></div>

    <!-- Inputs ocultos para captura de mídia -->
    <input type="file" id="cameraInput" accept="image/*" capture="environment" style="display:none;">
    <input type="file" id="videoInput" accept="video/*" capture="environment" style="display:none;">
    <input type="file" id="galleryInput" accept="image/*,video/*" multiple style="display:none;">

    <script>
    // ============================================================
    //  DADOS E CATEGORIAS
    // ============================================================
    const categories = [
        { id: 'motor', label: '🔧 Motor', items: [
            'Óleo do motor (nível/qualidade)',
            'Correia dentada / Corrente',
            'Correia de acessórios (alternador, ar cond.)',
            'Velas / Cabos de ignição',
            'Filtro de ar',
            'Filtro de combustível',
            'Sistema de injeção eletrônica',
            'Vazamentos de óleo',
            'Coxins do motor',
            'Barulhos anormais'
        ]},
        { id: 'suspensao', label: '🔩 Suspensão', items: [
            'Amortecedores dianteiros',
            'Amortecedores traseiros',
            'Molas / Feixe de molas',
            'Bandejas / Braços de suspensão',
            'Buchas da suspensão',
            'Pivôs',
            'Bieletas',
            'Barra estabilizadora',
            'Ruídos na suspensão'
        ]},
        { id: 'freios', label: '🛑 Freios', items: [
            'Pastilhas dianteiras',
            'Pastilhas traseiras',
            'Discos de freio dianteiros',
            'Discos de freio traseiros',
            'Fluido de freio (nível/qualidade)',
            'Flexíveis / Mangueiras de freio',
            'Freio de estacionamento',
            'Cilindro mestre',
            'Pedal de freio (curso/dureza)',
            'Lonas de freio (se aplicável)'
        ]},
        { id: 'transmissao', label: '⚙️ Transmissão', items: [
            'Embreagem (curso/patinação)',
            'Fluido de transmissão (automática)',
            'Óleo do câmbio (manual)',
            'Juntas homocinéticas',
            'Semieixos',
            'Diferencial',
            'Trizeta / Cardan',
            'Troca de marchas (suavidade)'
        ]},
        { id: 'eletrica', label: '⚡ Sistema Elétrico', items: [
            'Bateria (carga/terminais)',
            'Alternador (carga)',
            'Motor de partida',
            'Faróis (alto/baixo)',
            'Lanternas traseiras',
            'Setas / Pisca-alerta',
            'Luz de freio',
            'Luz de ré',
            'Buzina',
            'Painel de instrumentos',
            'Vidros elétricos',
            'Travas elétricas',
            'Ar condicionado',
            'Ventilador do radiador'
        ]},
        { id: 'pneus', label: '🛞 Pneus e Rodas', items: [
            'Pneu dianteiro esquerdo',
            'Pneu dianteiro direito',
            'Pneu traseiro esquerdo',
            'Pneu traseiro direito',
            'Estepe',
            'Alinhamento (desgaste irregular)',
            'Balanceamento (vibração)',
            'Calibragem',
            'Parafusos das rodas'
        ]},
        { id: 'direcao', label: '🔄 Direção', items: [
            'Folga do volante',
            'Terminais de direção',
            'Caixa de direção',
            'Fluido hidráulico (direção)',
            'Bomba da direção hidráulica',
            'Coluna de direção',
            'Coxim da caixa de direção'
        ]},
        { id: 'arrefecimento', label: '❄️ Arrefecimento', items: [
            'Líquido de arrefecimento (nível)',
            'Radiador (vazamentos/obstruções)',
            'Mangueiras do radiador',
            'Válvula termostática',
            'Bomba d\'água',
            'Ventoinha / Eletroventilador',
            'Tampa do radiador',
            'Reservatório de expansão'
        ]},
        { id: 'escapamento', label: '💨 Escapamento', items: [
            'Silenciador / Abafador',
            'Tubo de escape',
            'Catalisador',
            'Sonda lambda',
            'Fixação do escapamento',
            'Fumaça / Cor da fumaça',
            'Ruídos no escapamento'
        ]},
        { id: 'carroceria', label: '🚗 Carroceria e Interior', items: [
            'Lataria / Pintura',
            'Para-brisa (trincas)',
            'Vidros laterais',
            'Retrovisores',
            'Palhetas do limpador',
            'Esguichos de água',
            'Portas (abertura/fechamento)',
            'Capô (abertura/fechamento)',
            'Tampa do porta-malas',
            'Cintos de segurança',
            'Bancos (ajustes/integridade)',
            'Tapetes / Carpetes',
            'Chassi / Longarinas (corrosão)',
            'Estofamento / Forração'
        ]}
    ];

    // Estado global dos itens: { 'categoriaId_idx': { status, obs, images:[], videos:[], audios:[] } }
    let itemsState = {};

    function getKey(catId, idx) { return `${catId}_${idx}`; }

    function ensureItem(catId, idx) {
        const key = getKey(catId, idx);
        if (!itemsState[key]) {
            itemsState[key] = { status: null, obs: '', images: [], videos: [], audios: [] };
        }
        return itemsState[key];
    }

    // ============================================================
    //  RENDERIZAR CHECKLIST
    // ============================================================
    function renderCategories() {
        const container = document.getElementById('categoriesContainer');
        container.innerHTML = '';

        categories.forEach((cat) => {
            const catDiv = document.createElement('div');
            catDiv.innerHTML = `
                <div class="category-header" onclick="toggleCategory(this, '${cat.id}')">
                    <span style="font-weight:600;">${cat.label}</span>
                    <span style="font-size:12px;color:var(--muted);">${cat.items.length} itens</span>
                    <span class="arrow">▼</span>
                </div>
                <div class="items-container" id="items_${cat.id}"></div>
            `;
            container.appendChild(catDiv);

            const itemsContainer = document.getElementById(`items_${cat.id}`);
            cat.items.forEach((itemLabel, idx) => {
                const key = getKey(cat.id, idx);
                const data = ensureItem(cat.id, idx);
                const itemDiv = document.createElement('div');
                itemDiv.className = 'checklist-item';
                itemDiv.id = `item_${key}`;
                itemDiv.innerHTML = `
                    <span class="item-label">${itemLabel}</span>
                    <div class="status-btns">
                        <button class="status-btn ok ${data.status === 'ok' ? 'active' : ''}" 
                            title="OK" onclick="setStatus('${cat.id}',${idx},'ok')">✅</button>
                        <button class="status-btn repair ${data.status === 'repair' ? 'active' : ''}" 
                            title="Precisa de reparo" onclick="setStatus('${cat.id}',${idx},'repair')">🔧</button>
                        <button class="status-btn critical ${data.status === 'critical' ? 'active' : ''}" 
                            title="Crítico" onclick="setStatus('${cat.id}',${idx},'critical')">🚨</button>
                    </div>
                    <input class="item-obs" type="text" placeholder="Observação..." value="${escapeHtml(data.obs || '')}" 
                        onchange="setObs('${cat.id}',${idx},this.value)">
                    <div class="item-media" id="media_${key}">${renderMediaThumbs(data)}</div>
                    <div class="item-media">
                        <button class="media-btn" onclick="capturePhoto('${cat.id}',${idx})">📷 Foto</button>
                        <button class="media-btn" onclick="captureVideo('${cat.id}',${idx})">🎥 Vídeo</button>
                        <button class="media-btn" onclick="captureAudio('${cat.id}',${idx})">🎤 Áudio</button>
                        <button class="media-btn" onclick="pickFromGallery('${cat.id}',${idx})">🖼️ Galeria</button>
                    </div>
                `;
                itemsContainer.appendChild(itemDiv);
            });
        });
    }

    function renderMediaThumbs(data) {
        let html = '';
        (data.images || []).forEach((src, i) => {
            html += `<img class="media-thumb" src="${src}" onclick="viewMedia('${src}')" title="Foto ${i+1}">`;
        });
        (data.videos || []).forEach((src, i) => {
            html += `<video class="media-thumb" src="${src}" onclick="viewMedia('${src}')" title="Vídeo ${i+1}" muted></video>`;
        });
        (data.audios || []).forEach((src, i) => {
            html += `<div class="media-thumb audio-thumb" onclick="playAudio('${src}')" title="Áudio ${i+1}">🎵</div>`;
        });
        return html;
    }

    function refreshMediaDisplay(catId, idx) {
        const key = getKey(catId, idx);
        const data = ensureItem(catId, idx);
        const container = document.getElementById(`media_${key}`);
        if (container) container.innerHTML = renderMediaThumbs(data);
    }

    function setStatus(catId, idx, status) {
        const item = ensureItem(catId, idx);
        item.status = item.status === status ? null : status; // toggle off if same
        const key = getKey(catId, idx);
        const itemDiv = document.getElementById(`item_${key}`);
        if (itemDiv) {
            const btns = itemDiv.querySelectorAll('.status-btn');
            btns.forEach(b => b.classList.remove('active'));
            if (item.status) {
                const activeBtn = itemDiv.querySelector(`.status-btn.${item.status}`);
                if (activeBtn) activeBtn.classList.add('active');
            }
        }
    }

    function setObs(catId, idx, value) {
        const item = ensureItem(catId, idx);
        item.obs = value;
    }

    function toggleCategory(header, catId) {
        header.classList.toggle('open');
        document.getElementById(`items_${catId}`).classList.toggle('show');
    }

    function escapeHtml(str) {
        const div = document.createElement('div');
        div.textContent = str;
        return div.innerHTML;
    }

    // ============================================================
    //  CAPTURA DE MÍDIA
    // ============================================================
    let pendingMediaCatId = null;
    let pendingMediaIdx = null;
    let pendingMediaType = null;

    function capturePhoto(catId, idx) {
        pendingMediaCatId = catId;
        pendingMediaIdx = idx;
        pendingMediaType = 'image';
        document.getElementById('cameraInput').click();
    }

    function captureVideo(catId, idx) {
        pendingMediaCatId = catId;
        pendingMediaIdx = idx;
        pendingMediaType = 'video';
        document.getElementById('videoInput').click();
    }

    function captureAudio(catId, idx) {
        pendingMediaCatId = catId;
        pendingMediaIdx = idx;
        if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
            showToast('⚠️ Gravação de áudio não suportada neste navegador');
            return;
        }
        // Usar MediaRecorder para áudio
        navigator.mediaDevices.getUserMedia({ audio: true }).then(stream => {
            showToast('🎤 Gravando... Fale agora.');
            const mediaRecorder = new MediaRecorder(stream);
            const chunks = [];
            mediaRecorder.ondataavailable = e => chunks.push(e.data);
            mediaRecorder.onstop = () => {
                const blob = new Blob(chunks, { type: 'audio/webm' });
                const url = URL.createObjectURL(blob);
                const item = ensureItem(catId, idx);
                item.audios.push(url);
                refreshMediaDisplay(catId, idx);
                showToast('✅ Áudio gravado!');
                stream.getTracks().forEach(t => t.stop());
            };
            mediaRecorder.start();
            // Parar após 30 segundos ou ao tocar na notificação
            setTimeout(() => {
                if (mediaRecorder.state === 'recording') mediaRecorder.stop();
            }, 30000);
            // Criar botão de parar
            const stopToast = document.createElement('div');
            stopToast.style.cssText = 'position:fixed;bottom:80px;left:50%;transform:translateX(-50%);z-index:9999;';
            stopToast.innerHTML = '<button style="background:#ef4444;color:#fff;border:none;padding:10px 20px;border-radius:30px;font-size:14px;cursor:pointer;">⏹ Parar Gravação</button>';
            document.body.appendChild(stopToast);
            stopToast.querySelector('button').onclick = () => {
                if (mediaRecorder.state === 'recording') mediaRecorder.stop();
                stopToast.remove();
            };
            mediaRecorder.onstop = () => {
                stopToast.remove();
                const blob = new Blob(chunks, { type: 'audio/webm' });
                const url = URL.createObjectURL(blob);
                const item = ensureItem(catId, idx);
                item.audios.push(url);
                refreshMediaDisplay(catId, idx);
                showToast('✅ Áudio gravado!');
                stream.getTracks().forEach(t => t.stop());
            };
        }).catch(() => {
            showToast('❌ Não foi possível acessar o microfone');
        });
    }

    function pickFromGallery(catId, idx) {
        pendingMediaCatId = catId;
        pendingMediaIdx = idx;
        pendingMediaType = 'gallery';
        document.getElementById('galleryInput').click();
    }

    document.getElementById('cameraInput').addEventListener('change', function(e) {
        handleMediaFile(e.target.files[0], 'image');
        this.value = '';
    });
    document.getElementById('videoInput').addEventListener('change', function(e) {
        handleMediaFile(e.target.files[0], 'video');
        this.value = '';
    });
    document.getElementById('galleryInput').addEventListener('change', function(e) {
        Array.from(e.target.files).forEach(f => {
            const type = f.type.startsWith('video/') ? 'video' : 'image';
            handleMediaFile(f, type);
        });
        this.value = '';
    });

    function handleMediaFile(file, type) {
        if (!file) return;
        const catId = pendingMediaCatId;
        const idx = pendingMediaIdx;
        if (!catId && idx === null) return;

        const reader = new FileReader();
        reader.onload = function(e) {
            const item = ensureItem(catId, idx);
            if (type === 'image') item.images.push(e.target.result);
            else if (type === 'video') item.videos.push(e.target.result);
            refreshMediaDisplay(catId, idx);
            showToast(`✅ ${type === 'image' ? 'Foto' : 'Vídeo'} adicionado!`);
        };
        reader.readAsDataURL(file);
    }

    // Funções globais para visualização de mídia
    function viewMedia(src) {
        const w = window.open('', '_blank', 'width=800,height=600');
        if (!w) { showToast('⚠️ Pop-up bloqueado'); return; }
        w.document.write(`
            <html><head><title>Visualizar Mídia</title><style>
                body{margin:0;display:flex;align-items:center;justify-content:center;min-height:100vh;background:#000;}
                img,video{max-width:100%;max-height:100vh;}
                video{controls;autoplay;}
            </style></head><body>
                ${src.startsWith('data:video') || src.includes('video') 
                    ? `<video src="${src}" controls autoplay></video>` 
                    : `<img src="${src}">`}
            </body></html>
        `);
    }

    function playAudio(src) {
        const audio = new Audio(src);
        audio.play().catch(() => showToast('⚠️ Não foi possível reproduzir o áudio'));
    }

    // ============================================================
    //  RELATÓRIO
    // ============================================================
    function generateReport() {
        const cliente = document.getElementById('cliente').value.trim();
        const veiculo = document.getElementById('veiculo').value.trim();
        const placa = document.getElementById('placa').value.trim();
        const km = document.getElementById('km').value.trim();
        const dataInput = document.getElementById('data').value;
        const generalObs = document.getElementById('generalObs').value.trim();

        if (!cliente || !veiculo || !placa) {
            showToast('⚠️ Preencha: Cliente, Veículo e Placa');
            return;
        }

        // Coletar estatísticas
        let totalOk = 0, totalRepair = 0, totalCritical = 0, totalPhotos = 0, totalVideos = 0, totalAudios = 0;
        for (const cat of categories) {
            for (let idx = 0; idx < cat.items.length; idx++) {
                const data = ensureItem(cat.id, idx);
                if (data.status === 'ok') totalOk++;
                else if (data.status === 'repair') totalRepair++;
                else if (data.status === 'critical') totalCritical++;
                totalPhotos += (data.images || []).length;
                totalVideos += (data.videos || []).length;
                totalAudios += (data.audios || []).length;
            }
        }

        // Classificação
        let generalClassification, classLabel, classColor;
        if (totalCritical > 0) {
            generalClassification = 'red';
            classLabel = '🔴 Crítico - Requer atenção imediata';
            classColor = '#991b1b';
        } else if (totalRepair > 0) {
            generalClassification = 'yellow';
            classLabel = '🟡 Requer Atenção - Itens a reparar';
            classColor = '#854d0e';
        } else {
            generalClassification = 'green';
            classLabel = '🟢 Bom - Todos os itens OK';
            classColor = '#166534';
        }

        const dataFormatada = dataInput 
            ? new Date(dataInput + 'T00:00:00').toLocaleDateString('pt-BR') 
            : new Date().toLocaleDateString('pt-BR');
        const horaAtual = new Date().toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });

        // Armazenar dados para uso nas funções de compartilhamento
        window._reportData = {
            cliente, veiculo, placa, km,
            data: dataFormatada,
            hora: horaAtual,
            totalOk, totalRepair, totalCritical,
            totalPhotos, totalVideos, totalAudios,
            generalClassification, classLabel, classColor,
            generalObs
        };

        // Construir HTML do relatório com todas as mídias
        let reportHTML = buildReportHTML(window._reportData);

        // Renderizar na modal
        document.getElementById('reportBody').innerHTML = reportHTML;
        document.getElementById('reportFooter').innerHTML = `
            <button class="btn btn-whatsapp" onclick="previewWhatsApp()">📱 Enviar por WhatsApp</button>
            <button class="btn btn-primary" onclick="shareReportAsFile()">📤 Compartilhar Arquivo</button>
            <button class="btn btn-secondary" onclick="downloadReportHTML()">💾 Baixar Relatório</button>
            <button class="btn btn-secondary" onclick="printReport()">🖨️ Imprimir</button>
            <button class="btn btn-secondary" onclick="closeModal('reportModal')">Fechar</button>
        `;

        openModal('reportModal');
        showToast('✅ Relatório gerado!');
    }

                           '🔴 Crítico';

    function previewWhatsApp() {
        const dados = window._reportData;
        if (!dados) { showToast('❌ Gere o relatório primeiro'); return; }

        const texto = buildWhatsAppText(dados);

        const previewHTML = `

            </div>
        `;

        document.getElementById('whatsappPreviewContent').innerHTML = previewHTML;
        openModal('whatsappPreviewModal');

    function sendWhatsAppMessage() {
        const dados = window._reportData;
        if (!dados) return;

        const texto = buildWhatsAppText(dados);
        // Remover asteriscos de negrito do WhatsApp para a URL (eles funcionam no app, mas não na URL)
        const textoLimpo = texto.replace(/\*/g, '');
        const url = 'https://wa.me/?text=' + encodeURIComponent(textoLimpo);

        const win = window.open(url, '_blank');
        if (!win) {
            // Fallback: copiar para clipboard
            navigator.clipboard.writeText(textoLimpo).then(() => {
                showToast('📋 Texto copiado! Cole no WhatsApp. (Pop-up bloqueado)');
            }).catch(() => {
                showToast('⚠️ Pop-up bloqueado. O texto está pronto para colar.');
            });
        } else {
            closeModal('whatsappPreviewModal');
            closeModal('reportModal');
        }
    }

            }).catch(() => {});

    // ============================================================
    //  INICIALIZAÇÃO
    // ============================================================
    function init() {
        // Preencher data atual
        document.getElementById('data').value = new Date().toISOString().split('T')[0];

        // Renderizar categorias
        renderCategories();

        // Abrir primeira categoria por padrão
        const firstHeader = document.querySelector('.category-header');
        if (firstHeader) firstHeader.click();

        // Carregar dados salvos do localStorage (se existir)
        loadState();
    }

    function saveState() {
        const state = {
            cliente: document.getElementById('cliente').value,
            veiculo: document.getElementById('veiculo').value,
            placa: document.getElementById('placa').value,
            km: document.getElementById('km').value,
            data: document.getElementById('data').value,
            generalObs: document.getElementById('generalObs').value,
            itemsState: itemsState
        };
        try {
            localStorage.setItem('checklist_mecanica_brasil', JSON.stringify(state));
        } catch(e) {
            // localStorage pode estar cheio por causa das mídias
            console.warn('Não foi possível salvar estado:', e.message);
        }
    }

    function loadState() {
        try {
            const saved = localStorage.getItem('checklist_mecanica_brasil');
            if (saved) {
                const state = JSON.parse(saved);
                if (state.cliente) document.getElementById('cliente').value = state.cliente;
                if (state.veiculo) document.getElementById('veiculo').value = state.veiculo;
                if (state.placa) document.getElementById('placa').value = state.placa;
                if (state.km) document.getElementById('km').value = state.km;
                if (state.data) document.getElementById('data').value = state.data;
                if (state.generalObs) document.getElementById('generalObs').value = state.generalObs;
                if (state.itemsState) {
                    itemsState = state.itemsState;
                    renderCategories();
                }
            }
        } catch(e) {
            console.warn('Erro ao carregar estado:', e.message);
        }
    }

    // Salvar estado periodicamente
    setInterval(saveState, 5000);
    // Salvar ao sair
    window.addEventListener('beforeunload', saveState);
    // Salvar ao modificar campos
    ['cliente', 'veiculo', 'placa', 'km', 'data', 'generalObs'].forEach(id => {
        const el = document.getElementById(id);
        if (el) el.addEventListener('change', saveState);
        if (el && (el.tagName === 'INPUT' && el.type === 'text')) el.addEventListener('input', saveState);
    });

    // Iniciar
    init();
    </script>
</body>
</html>
