<script>
  const VALIDITY_MS = 365 * 24 * 60 * 60 * 1000;
  const COMPANY_PHONES = ['6596167870', '65996167870'];

  let vouchers = [];
  let deletionLog = [];
  let currentFile = null;
  let currentVoucherId = null;
  let voucherToDelete = null;
  let html5QrCode = null;
  let scannerActive = false;
  let lastScannedCode = null;
  let lastScanTime = 0;
  let firebaseInitialized = false;

  // ✅ NOVO: controla se o documento foi processado com sucesso e tem nome válido
  let extractionState = {
    fileAttached: false,   // um arquivo foi selecionado
    fileProcessed: false,  // o arquivo foi lido (PDF processado, mesmo que parcial)
    osFound: null,
    nameFound: null,
    phoneFound: null
  };

  // ===== INICIALIZAÇÃO COM FIREBASE =====
  function setSyncStatus(status, text) {
    const ind = document.getElementById('syncIndicator');
    ind.className = 'sync-indicator ' + status;
    ind.textContent = text;
  }

  async function loadFromFirestore(showFeedback = false) {
    if (!window.firebaseReady) return;
    try {
      setSyncStatus('syncing', 'Sincronizando...');
      const { collection, getDocs } = window.firestoreFns;
      const db = window.firebaseDB;

      const vSnap = await getDocs(collection(db, 'vouchers'));
      vouchers = [];
      vSnap.forEach(d => vouchers.push({ ...d.data(), _docId: d.id }));

      const dSnap = await getDocs(collection(db, 'deletionLog'));
      deletionLog = [];
      dSnap.forEach(d => deletionLog.push({ ...d.data(), _docId: d.id }));

      setSyncStatus('online', 'Online ✓');

      const activePanel = document.querySelector('.panel.active');
      if (activePanel) {
        const idx = activePanel.id.replace('panel-', '');
        if (idx === '2') renderTable();
        if (idx === '3') renderReport();
      }

      if (showFeedback) {
        const ind = document.getElementById('syncIndicator');
        ind.textContent = 'Atualizado ✓';
        setTimeout(() => setSyncStatus('online', 'Online ✓'), 1500);
      }
    } catch (err) {
      console.error('Erro ao carregar do Firestore:', err);
      setSyncStatus('offline', 'Erro de conexão');
    }
  }

  window.addEventListener('firebase-ready', async () => {
    firebaseInitialized = true;
    document.getElementById('loadingText').textContent = 'Carregando vouchers...';
    await loadFromFirestore();
    document.getElementById('loadingOverlay').classList.add('hidden');
  });

  setTimeout(() => {
    if (!firebaseInitialized) {
      document.getElementById('loadingOverlay').classList.add('hidden');
      setSyncStatus('offline', 'Sem conexão');
      alert('Não foi possível conectar ao banco de dados. Verifique sua conexão com a internet.');
    }
  }, 10000);

  // ===== UTILITÁRIOS =====
  function switchTab(index) {
    if (scannerActive && index !== 1) stopScanner();
    document.querySelectorAll('.tab').forEach((t, i) => t.classList.toggle('active', i === index));
    document.querySelectorAll('.panel').forEach((p, i) => p.classList.toggle('active', i === index));
    if (index === 2) renderTable();
    if (index === 3) renderReport();
  }

  function getStatus(v) {
    if (v.status === 'UTILIZADO') return 'UTILIZADO';
    if (v.expiryDate && new Date(v.expiryDate) < new Date()) return 'EXPIRADO';
    return 'ATIVO';
  }
  function daysUntilExpiry(v) {
    if (!v.expiryDate) return null;
    return Math.ceil((new Date(v.expiryDate) - new Date()) / (24*60*60*1000));
  }
  function formatDate(iso) { return iso ? new Date(iso).toLocaleDateString('pt-BR') : '—'; }

  function extractOSNumber(text) {
    const patterns = [/OS\s*N[ºo°\.]?\s*[:\-]?\s*(\d{1,8})/i, /Ordem\s+de\s+Servi[çc]o\s*N?[ºo°\.]?\s*[:\-]?\s*(\d{1,8})/i];
    for (const p of patterns) { const m = text.match(p); if (m && m[1]) return m[1].trim(); }
    return null;
  }
  function extractClientName(text) {
    let m = text.match(/([A-ZÁÉÍÓÚÂÊÔÃÕÇ][A-ZÁÉÍÓÚÂÊÔÃÕÇ\s]{4,80}?)\s*(?:\[[^\]]*\])?\s*\/\/\s*\d{3}\.\d{3}\.\d{3}-\d{2}/);
    if (m && m[1]) return cleanName(m[1]);
    m = text.match(/Cliente\s*[:\-]?\s*([A-ZÁÉÍÓÚÂÊÔÃÕÇ][A-ZÁÉÍÓÚÂÊÔÃÕÇ\s]{4,80})/i);
    if (m && m[1]) return cleanName(m[1]);
    return null;
  }
  function cleanName(name) {
    return name.replace(/\[\]/g, '').replace(/\s+/g, ' ').trim()
      .split(' ').map(w => w.charAt(0).toUpperCase() + w.slice(1).toLowerCase()).join(' ');
  }

  function isCompanyPhone(phone) {
    const digits = phone.replace(/\D/g, '');
    return COMPANY_PHONES.some(cp => digits === cp || digits.endsWith(cp.slice(-10)) || cp.endsWith(digits.slice(-10)));
  }
  function isValidCellphone(digits) {
    if (digits.length !== 11) return false;
    const ddd = parseInt(digits.slice(0, 2));
    if (ddd < 11 || ddd > 99) return false;
    if (digits[2] !== '9') return false;
    return true;
  }

  function extractPhone(text) {
    const cpfAnchorRegex = /\d{3}\.\d{3}\.\d{3}-\d{2}[\s\S]{0,80}?\((\d{2})\)\s*9?\s*(\d{4,5})[\s\-]?(\d{4})/;
    const am = text.match(cpfAnchorRegex);
    if (am) {
      const candidate = (am[1] + am[2] + am[3]).replace(/\D/g, '');
      let normalized = candidate;
      if (candidate.length === 10) normalized = candidate.slice(0, 2) + '9' + candidate.slice(2);
      if (!isCompanyPhone(normalized) && isValidCellphone(normalized)) return normalized;
    }
    const regex = /\((\d{2})\)\s*(9?)\s*(\d{4,5})[\s\-]?(\d{4})/g;
    const candidates = [];
    let m;
    while ((m = regex.exec(text)) !== null) {
      const ddd = m[1], has9 = m[2] === '9', mid = m[3], last = m[4];
      let full;
      if (has9) full = ddd + '9' + mid + last;
      else if (mid.length === 5 && mid[0] === '9') full = ddd + mid + last;
      else if (mid.length === 4) full = ddd + '9' + mid + last;
      else full = ddd + mid + last;
      full = full.replace(/\D/g, '');
      if (!isCompanyPhone(full) && isValidCellphone(full)) candidates.push({ phone: full, position: m.index });
    }
    if (candidates.length === 0) return null;
    const cpfMatch = text.match(/\d{3}\.\d{3}\.\d{3}-\d{2}/);
    if (cpfMatch && candidates.length > 1) {
      const cpfPos = cpfMatch.index;
      candidates.sort((a, b) => Math.abs(a.position - cpfPos) - Math.abs(b.position - cpfPos));
    }
    return candidates[0].phone;
  }

  function formatPhoneDisplay(phone) {
    if (!phone) return '—';
    const c = phone.replace(/\D/g, '');
    if (c.length === 11) return `(${c.slice(0,2)}) ${c.slice(2,7)}-${c.slice(7)}`;
    if (c.length === 10) return `(${c.slice(0,2)}) ${c.slice(2,6)}-${c.slice(6)}`;
    return phone;
  }
  function getFirstName(n) { return n ? n.trim().split(' ')[0] : ''; }

  async function extractTextFromPDF(buffer) {
    const pdf = await pdfjsLib.getDocument({ data: buffer }).promise;
    let text = '';
    for (let i = 1; i <= pdf.numPages; i++) {
      const page = await pdf.getPage(i);
      const c = await page.getTextContent();
      text += c.items.map(it => it.str).join(' ') + '\n';
    }
    return text;
  }

  function updateExtractedDisplay(os, name, phone) {
    const ex = document.getElementById('extractedData');
    ex.classList.add('show');
    document.getElementById('exOs').innerHTML = `<span>OS:</span><span>${os || 'não localizada'}</span>`;
    document.getElementById('exOs').className = 'item' + (os ? '' : ' missing');
    document.getElementById('exName').innerHTML = `<span>Cliente:</span><span>${name || 'não localizado'}</span>`;
    document.getElementById('exName').className = 'item' + (name ? '' : ' missing');
    document.getElementById('exPhone').innerHTML = `<span>Telefone do cliente:</span><span>${phone ? formatPhoneDisplay(phone) : 'não localizado'}</span>`;
    document.getElementById('exPhone').className = 'item' + (phone ? '' : ' missing');
  }

  // ✅ ALTERADO: controla estado de extração + trava/libera campos
  document.getElementById('osFile').addEventListener('change', async function(e) {
    const file = e.target.files[0];

    // Reseta estado a cada novo arquivo selecionado
    extractionState = { fileAttached: false, fileProcessed: false, osFound: null, nameFound: null, phoneFound: null };
    document.getElementById('osNumber').value = '';
    document.getElementById('clientName').value = '';
    document.getElementById('clientPhone').value = '';
    document.getElementById('osNumber').classList.remove('auto-filled');
    document.getElementById('clientName').classList.remove('auto-filled');
    document.getElementById('clientPhone').classList.remove('auto-filled');
    document.getElementById('clientName').readOnly = true;
    document.getElementById('nameHint').textContent = '(extraído do documento da OS)';

    if (!file) return;
    if (file.size > 10 * 1024 * 1024) { alert('Arquivo muito grande (10MB).'); this.value=''; return; }

    extractionState.fileAttached = true;
    currentFile = { name: file.name, type: file.type };

    const fi = document.getElementById('fileInfo');
    fi.className = 'file-info';
    fi.innerHTML = '<span class="loader"></span> Lendo arquivo...';

    if (file.type === 'application/pdf') {
      try {
        const buffer = await file.arrayBuffer();
        const text = await extractTextFromPDF(buffer);
        const os = extractOSNumber(text);
        const name = extractClientName(text);
        const phone = extractPhone(text);

        extractionState.fileProcessed = true;
        extractionState.osFound = os;
        extractionState.nameFound = name;
        extractionState.phoneFound = phone;

        if (os) { document.getElementById('osNumber').value = os; document.getElementById('osNumber').classList.add('auto-filled'); }
        if (name) {
          document.getElementById('clientName').value = name;
          document.getElementById('clientName').classList.add('auto-filled');
          document.getElementById('clientName').readOnly = true; // ✅ nome travado quando extraído
          document.getElementById('nameHint').textContent = '(extraído do documento da OS — não editável)';
        } else {
          // ✅ Não foi possível extrair o nome: libera edição manual, mas sinaliza claramente
          document.getElementById('clientName').readOnly = false;
          document.getElementById('nameHint').textContent = '(NÃO extraído — confira o cadastro da OS e digite manualmente)';
        }
        if (phone) { document.getElementById('clientPhone').value = phone; document.getElementById('clientPhone').classList.add('auto-filled'); }

        updateExtractedDisplay(os, name, phone);
        const count = [os, name, phone].filter(Boolean).length;
        fi.innerHTML = `<strong>${file.name}</strong> — ${count}/3 dados extraídos (PDF descartado após leitura)`;
        if (count < 3) fi.className = 'file-info error';

        if (!os) {
          fi.className = 'file-info error';
          fi.innerHTML += '<br>⚠️ Número da OS não localizado — não será possível gerar o voucher sem ele.';
        }
      } catch (err) {
        extractionState.fileProcessed = false;
        fi.className = 'file-info error';
        fi.innerHTML = '⚠️ Falha ao ler o PDF. Anexe um arquivo válido da OS.';
        document.getElementById('clientName').readOnly = false;
        document.getElementById('nameHint').textContent = '(falha na leitura — digite manualmente conforme o cadastro da OS)';
      }
    } else {
      // Arquivo não é PDF: não há extração automática confiável
      extractionState.fileProcessed = false;
      fi.className = 'file-info error';
      fi.innerHTML = `<strong>${file.name}</strong> — extração automática só é feita em PDF. Prefira anexar o PDF da OS.`;
      document.getElementById('clientName').readOnly = false;
      document.getElementById('osNumber').readOnly = false;
      document.getElementById('nameHint').textContent = '(arquivo não é PDF — digite manualmente exatamente como está no cadastro da OS)';
    }
  });

  // ===== GERAR VOUCHER (SALVA NO FIRESTORE) =====
  async function generateVoucher() {
    if (!window.firebaseReady) { alert('Aguarde a conexão com o banco de dados.'); return; }

    // ✅ OBRIGATORIEDADE DO ARQUIVO DA OS
    if (!extractionState.fileAttached || !currentFile) {
      alert('É obrigatório anexar o arquivo da Ordem de Serviço antes de gerar o voucher.');
      document.getElementById('osFile').focus();
      return;
    }

    const osNumber = document.getElementById('osNumber').value.trim().replace(/\s+/g, '');
    const clientName = document.getElementById('clientName').value.trim();
    const clientPhoneRaw = document.getElementById('clientPhone').value.replace(/\D/g, '');

    if (!osNumber) {
      alert('Número da OS não identificado no documento. Verifique o arquivo anexado.');
      return;
    }
    if (!clientName) {
      alert('Nome do cliente não identificado. Confira o cadastro da OS e preencha o campo antes de continuar.');
      document.getElementById('clientName').focus();
      return;
    }
    // ✅ Se o nome foi extraído automaticamente, garante que não foi adulterado
    if (extractionState.nameFound && clientName !== extractionState.nameFound) {
      alert('O nome do cliente não pode ser alterado — deve ser o mesmo do cadastro na Ordem de Serviço.');
      document.getElementById('clientName').value = extractionState.nameFound;
      return;
    }
    if (clientPhoneRaw && isCompanyPhone(clientPhoneRaw)) {
      alert('O número informado é o da Mecânica Brasil, não do cliente. Corrija antes de gerar o voucher.');
      document.getElementById('clientPhone').focus();
      return;
    }
    if (vouchers.some(v => v.osNumber.toUpperCase() === osNumber.toUpperCase())) {
      alert('Já existe voucher para esta OS.'); return;
    }

    const now = new Date();
    const expiry = new Date(now.getTime() + VALIDITY_MS);
    const voucherId = 'VC-' + Date.now().toString(36).toUpperCase();
    const voucher = {
      voucherId, osNumber, clientName, clientPhone: clientPhoneRaw,
      issueDate: now.toLocaleDateString('pt-BR'),
      issueTimestamp: now.getTime(),
      expiryDate: expiry.toISOString(),
      status: 'ATIVO', usedAt: null, usedTimestamp: null
    };

    try {
      setSyncStatus('syncing', 'Salvando...');
      const { doc, setDoc } = window.firestoreFns;
      const db = window.firebaseDB;
      await setDoc(doc(db, 'vouchers', voucherId), voucher);
      voucher._docId = voucherId;
      vouchers.push(voucher);
      currentVoucherId = voucherId;
      setSyncStatus('online', 'Online ✓');
    } catch (err) {
      console.error('Erro ao salvar:', err);
      setSyncStatus('offline', 'Erro ao salvar');
      alert('Erro ao salvar o voucher no banco. Verifique sua conexão e tente novamente.');
      return;
    }

    const firstName = getFirstName(clientName);
    document.getElementById('vGreeting').textContent = firstName ? `Olá, ${firstName}!` : 'Olá!';
    document.getElementById('vOs').textContent = osNumber;
    document.getElementById('vDate').textContent = voucher.issueDate;
    document.getElementById('vExpiry').textContent = expiry.toLocaleDateString('pt-BR');

    document.getElementById('qrcode').innerHTML = '';
    new QRCode(document.getElementById('qrcode'), {
      text: JSON.stringify({ voucherId, osNumber }),
      width: 130, height: 130,
      correctLevel: QRCode.CorrectLevel.H
    });
    document.getElementById('whatsNumber').value = clientPhoneRaw;
    document.getElementById('voucherWrapper').classList.add('show');
    document.getElementById('voucherWrapper').scrollIntoView({ behavior: 'smooth' });

    // ✅ Reseta o formulário/estado para a próxima emissão
    resetIssuanceForm();
  }

  // ✅ NOVO: reseta o formulário de emissão após gerar o voucher
  function resetIssuanceForm() {
    extractionState = { fileAttached: false, fileProcessed: false, osFound: null, nameFound: null, phoneFound: null };
    currentFile = null;
    document.getElementById('osFile').value = '';
    document.getElementById('osNumber').value = '';
    document.getElementById('clientName').value = '';
    document.getElementById('clientPhone').value = '';
    document.getElementById('clientName').readOnly = true;
    document.getElementById('nameHint').textContent = '(extraído do documento da OS)';
    document.getElementById('fileInfo').innerHTML = '';
    document.getElementById('extractedData').classList.remove('show');
  }

  function downloadVoucher() {
    html2canvas(document.getElementById('voucherCard'), { scale: 2, backgroundColor: null }).then(canvas => {
      const link = document.createElement('a');
      link.download = 'voucher-' + currentVoucherId + '.png';
      link.href = canvas.toDataURL('image/png');
      link.click();
    });
  }

  function sendWhatsApp() {
    const number = document.getElementById('whatsNumber').value.replace(/\D/g, '');
    if (!number || number.length < 10) { alert('Número inválido.'); return; }
    if (isCompanyPhone(number)) {
      alert('Esse é o número da Mecânica Brasil, não do cliente. Corrija o número antes de enviar.');
      document.getElementById('whatsNumber').focus();
      return;
    }
    const v = vouchers.find(x => x.voucherId === currentVoucherId);
    if (!v) return;

    const firstName = getFirstName(v.clientName);
    const greeting = firstName ? `Olá, *${firstName}*!` : 'Olá!';
    const expiry = new Date(v.expiryDate).toLocaleDateString('pt-BR');

    const msg =
`*PARQUE DAS ÁGUAS — VOUCHER CORTESIA*

${greeting} Muito obrigado por confiar nos serviços da *Mecânica Brasil*!

Como forma de agradecimento, você ganhou:
*2 ACESSOS ao Parque das Águas*

*Dados do seu voucher:*
- OS: *${v.osNumber}*
- Emitido em: ${v.issueDate}
- Válido até: *${expiry}*

*Como usar:*
Apresente o voucher (imagem em anexo) no totem do parque. A validação é feita por leitura do QR Code pela câmera.

_Voucher pessoal e intransferível. Validade de 1 ano._

Aproveite muito!`;

    const fullNumber = number.startsWith('55') ? number : '55' + number;
    window.open(`https://wa.me/${fullNumber}?text=${encodeURIComponent(msg)}`, '_blank');
  }

  // ===== TOTEM — SCANNER =====
  function setScannerStatus(text, type) {
    const el = document.getElementById('scannerStatus');
    el.textContent = text;
    el.className = 'scanner-status' + (type ? ' ' + type : '');
  }

  async function startScanner() {
    if (scannerActive) return;
    setScannerStatus('Iniciando câmera...', '');
    try {
      html5QrCode = new Html5Qrcode("qr-reader");
      const config = { fps: 10, qrbox: { width: 250, height: 250 }, aspectRatio: 1.333, showTorchButtonIfSupported: true, showZoomSliderIfSupported: true };
      await html5QrCode.start({ facingMode: "environment" }, config, onScanSuccess, onScanFailure);
      scannerActive = true;
      setScannerStatus('Câmera ativa — aponte o QR Code do voucher', 'active');
      document.getElementById('startScannerBtn').disabled = true;
      document.getElementById('stopScannerBtn').disabled = false;
    } catch (err) {
      console.error('Erro câmera traseira:', err);
      try {
        await html5QrCode.start({ facingMode: "user" }, { fps: 10, qrbox: { width: 250, height: 250 } }, onScanSuccess, onScanFailure);
        scannerActive = true;
        setScannerStatus('Câmera ativa (frontal) — aponte o QR Code', 'active');
        document.getElementById('startScannerBtn').disabled = true;
        document.getElementById('stopScannerBtn').disabled = false;
      } catch (err2) {
        setScannerStatus('Erro ao acessar câmera. Permita o uso da câmera no navegador ou use a busca manual abaixo.', 'error');
      }
    }
  }

  async function stopScanner() {
    if (!scannerActive || !html5QrCode) return;
    try {
      await html5QrCode.stop();
      html5QrCode.clear();
      scannerActive = false;
      setScannerStatus('Câmera desligada', '');
      document.getElementById('startScannerBtn').disabled = false;
      document.getElementById('stopScannerBtn').disabled = true;
    } catch (err) { console.error(err); }
  }

  function onScanSuccess(decodedText) {
    const now = Date.now();
    if (decodedText === lastScannedCode && (now - lastScanTime) < 3000) return;
    lastScannedCode = decodedText;
    lastScanTime = now;
    setScannerStatus('QR Code lido com sucesso! Validando...', 'active');
    try {
      const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      const oscillator = audioCtx.createOscillator();
      const gainNode = audioCtx.createGain();
      oscillator.connect(gainNode);
      gainNode.connect(audioCtx.destination);
      oscillator.frequency.value = 800;
      oscillator.type = 'sine';
      gainNode.gain.setValueAtTime(0.3, audioCtx.currentTime);
      gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.2);
      oscillator.start(audioCtx.currentTime);
      oscillator.stop(audioCtx.currentTime + 0.2);
    } catch(e) {}
    validateVoucher(decodedText);
  }

  function onScanFailure(error) { /* silencioso */ }

  // ===== VALIDAÇÃO =====
  async function validateVoucher(input) {
    const raw = (input || '').trim();
    const box = document.getElementById('validationResult');
    if (!raw) { alert('Código vazio.'); return; }

    await loadFromFirestore();

    let key = raw.toUpperCase();
    try {
      const p = JSON.parse(raw);
      key = (p.voucherId || p.osNumber || '').toUpperCase();
    } catch(e) {}

    const v = vouchers.find(x =>
      (x.voucherId || '').toUpperCase() === key ||
      (x.osNumber || '').toUpperCase() === key
    );

    box.classList.add('show');
    box.scrollIntoView({ behavior: 'smooth', block: 'center' });

    if (!v) {
      box.className = 'result show invalid';
      box.innerHTML = `<h4>Voucher Não Encontrado</h4><p>Código não corresponde a nenhum voucher emitido.</p>
        <button class="btn btn-secondary" onclick="clearResult()" style="margin-top:14px;">Nova Validação</button>`;
      setScannerStatus('Voucher não encontrado — tente outro QR Code', 'error');
      return;
    }

    const status = getStatus(v);

    if (status === 'EXPIRADO') {
      box.className = 'result show expired';
      box.innerHTML = `<h4>Voucher Expirado</h4>
        <div class="result-info">
          <div><strong>Cliente:</strong> ${v.clientName || '—'}</div>
          <div><strong>OS:</strong> ${v.osNumber}</div>
          <div><strong>Expirou em:</strong> ${formatDate(v.expiryDate)}</div>
        </div>
        <button class="btn btn-secondary" onclick="clearResult()" style="margin-top:14px;">Nova Validação</button>`;
      setScannerStatus('Voucher expirado', 'error');
      return;
    }

    if (status === 'UTILIZADO') {
      box.className = 'result show used';
      box.innerHTML = `<h4>Voucher Já Utilizado</h4>
        <div class="result-info">
          <div><strong>Cliente:</strong> ${v.clientName || '—'}</div>
          <div><strong>OS:</strong> ${v.osNumber}</div>
          <div><strong>Utilizado em:</strong> ${v.usedAt}</div>
        </div>
        <button class="btn btn-secondary" onclick="clearResult()" style="margin-top:14px;">Nova Validação</button>`;
      setScannerStatus('Voucher já utilizado', 'error');
      return;
    }

    const days = daysUntilExpiry(v);
    box.className = 'result show valid';
    box.innerHTML = `<h4>Voucher Válido — Acesso Liberado</h4>
      <div class="result-info">
        <div><strong>Cliente:</strong> ${v.clientName || '—'}</div>
        <div><strong>OS:</strong> ${v.osNumber}</div>
        <div><strong>Válido até:</strong> ${formatDate(v.expiryDate)} <em>(${days} dias)</em></div>
        <div><strong>Direito a:</strong> 2 acessos</div>
      </div>
      <button class="btn btn-success" onclick="confirmUse('${v.voucherId}')">Confirmar Entrada</button>
      <button class="btn btn-secondary" onclick="clearResult()" style="margin-top:8px;">Cancelar</button>`;
    setScannerStatus('Voucher válido — confirme a entrada', 'active');
  }

  function clearResult() {
    document.getElementById('validationResult').classList.remove('show');
    document.getElementById('searchCode').value = '';
    lastScannedCode = null;
    if (scannerActive) setScannerStatus('Câmera ativa — aponte o QR Code do voucher', 'active');
  }

  // ===== CONFIRMAR USO =====
  async function confirmUse(voucherId) {
    const v = vouchers.find(x => x.voucherId === voucherId);
    if (!v) return;

    const usedAt = new Date().toLocaleString('pt-BR');
    const usedTimestamp = Date.now();

    try {
      setSyncStatus('syncing', 'Confirmando...');
      const { doc, updateDoc } = window.firestoreFns;
      const db = window.firebaseDB;
      await updateDoc(doc(db, 'vouchers', v._docId || v.voucherId), {
        status: 'UTILIZADO',
        usedAt: usedAt,
        usedTimestamp: usedTimestamp
      });
      v.status = 'UTILIZADO';
      v.usedAt = usedAt;
      v.usedTimestamp = usedTimestamp;
      setSyncStatus('online', 'Online ✓');
    } catch (err) {
      console.error('Erro ao confirmar uso:', err);
      setSyncStatus('offline', 'Erro ao salvar');
      alert('Erro ao registrar o uso. Tente novamente.');
      return;
    }

    document.getElementById('validationResult').innerHTML = `<h4>Entrada Confirmada</h4>
      <p>${v.clientName ? v.clientName + ' — ' : ''}OS <strong>${v.osNumber}</strong> liberada às ${v.usedAt}</p>
      <button class="btn btn-secondary" onclick="clearResult()" style="margin-top:14px;">Validar Próximo</button>`;
    setScannerStatus('Entrada confirmada — pronto para próxima validação', 'active');
  }

  // ===== EXCLUSÃO COM AUDITORIA =====
  function openDeleteModal(voucherId) {
    const v = vouchers.find(x => x.voucherId === voucherId);
    if (!v) return;
    voucherToDelete = v;
    document.getElementById('deleteVoucherSummary').innerHTML = `
      <div><strong>OS:</strong> ${v.osNumber}</div>
      <div><strong>Cliente:</strong> ${v.clientName || '—'}</div>
      <div><strong>Telefone:</strong> ${formatPhoneDisplay(v.clientPhone)}</div>
      <div><strong>Status:</strong> ${getStatus(v)}</div>
      <div><strong>Emitido em:</strong> ${v.issueDate}</div>
    `;
    document.getElementById('deleteReason').value = '';
    document.getElementById('deletedBy').value = '';
    document.getElementById('charCounter').textContent = '0 / 30 caracteres';
    document.getElementById('charCounter').className = 'char-counter';
    document.getElementById('confirmDeleteBtn').disabled = true;
    document.getElementById('deleteModal').classList.add('show');
  }

  function closeDeleteModal() {
    document.getElementById('deleteModal').classList.remove('show');
    voucherToDelete = null;
  }

  document.getElementById('deleteReason').addEventListener('input', function() {
    const len = this.value.trim().length;
    const counter = document.getElementById('charCounter');
    counter.textContent = `${len} / 30 caracteres`;
    if (len >= 30) {
      counter.className = 'char-counter ok';
      document.getElementById('confirmDeleteBtn').disabled = false;
    } else {
      counter.className = 'char-counter error';
      document.getElementById('confirmDeleteBtn').disabled = true;
    }
  });

  async function confirmDelete() {
    if (!voucherToDelete) return;
    const reason = document.getElementById('deleteReason').value.trim();
    const deletedBy = document.getElementById('deletedBy').value.trim() || 'Não informado';
    if (reason.length < 30) { alert('A justificativa deve ter no mínimo 30 caracteres.'); return; }

    const logEntry = {
      voucherId: voucherToDelete.voucherId,
      osNumber: voucherToDelete.osNumber,
      clientName: voucherToDelete.clientName || '',
      clientPhone: voucherToDelete.clientPhone || '',
      issueDate: voucherToDelete.issueDate,
      previousStatus: getStatus(voucherToDelete),
      deletedAt: new Date().toLocaleString('pt-BR'),
      deletedTimestamp: Date.now(),
      deletedBy: deletedBy,
      reason: reason
    };

    try {
      setSyncStatus('syncing', 'Excluindo...');
      const { collection, doc, deleteDoc, addDoc } = window.firestoreFns;
      const db = window.firebaseDB;

      await addDoc(collection(db, 'deletionLog'), logEntry);
      await deleteDoc(doc(db, 'vouchers', voucherToDelete._docId || voucherToDelete.voucherId));

      deletionLog.push(logEntry);
      vouchers = vouchers.filter(v => v.voucherId !== voucherToDelete.voucherId);
      setSyncStatus('online', 'Online ✓');
    } catch (err) {
      console.error('Erro ao excluir:', err);
      setSyncStatus('offline', 'Erro ao excluir');
      alert('Erro ao excluir o voucher. Tente novamente.');
      return;
    }

    closeDeleteModal();
    renderTable();
    alert(`Voucher da OS ${logEntry.osNumber} excluído. Registro de auditoria salvo.`);
  }

  // ===== TABELA =====
  function renderTable() {
    const body = document.getElementById('vouchersBody');
    const filterStatus = document.getElementById('statusFilter').value;
    const search = document.getElementById('searchFilter').value.toLowerCase();
    let list = vouchers.map(v => ({...v, _status: getStatus(v)}));
    list.sort((a, b) => (b.issueTimestamp || 0) - (a.issueTimestamp || 0));
    if (filterStatus) list = list.filter(v => v._status === filterStatus);
    if (search) list = list.filter(v =>
      (v.osNumber || '').toLowerCase().includes(search) ||
      (v.clientName || '').toLowerCase().includes(search) ||
      (v.voucherId || '').toLowerCase().includes(search));
    if (list.length === 0) { body.innerHTML = '<tr><td colspan="8" class="empty">Nenhum voucher encontrado</td></tr>'; return; }
    body.innerHTML = list.map(v => {
      const days = daysUntilExpiry(v);
      const badgeClass = v._status === 'ATIVO' ? 'badge-active' : v._status === 'UTILIZADO' ? 'badge-used' : 'badge-expired';
      const expiryWarn = (v._status === 'ATIVO' && days !== null && days <= 30) ? `<br><span class="badge badge-warning">${days}d</span>` : '';
      return `<tr>
        <td><strong>${v.osNumber}</strong></td>
        <td>${v.clientName || '—'}</td>
        <td>${formatPhoneDisplay(v.clientPhone)}</td>
        <td>${v.issueDate}</td>
        <td>${formatDate(v.expiryDate)}${expiryWarn}</td>
        <td><span class="badge ${badgeClass}">${v._status}</span></td>
        <td>${v.usedAt || '—'}</td>
        <td><button class="delete-btn" onclick="openDeleteModal('${v.voucherId}')">Excluir</button></td>
      </tr>`;
    }).join('');
  }

  // ===== RELATÓRIO =====
  function renderReport() {
    const container = document.getElementById('reportContent');
    const list = vouchers.map(v => ({...v, _status: getStatus(v)}));
    if (list.length === 0 && deletionLog.length === 0) {
      container.innerHTML = '<div class="empty" style="padding:60px; background:#0f172a; border-radius:12px;">Ainda não há vouchers emitidos para gerar relatório</div>';
      return;
    }
    const total = list.length;
    const totalComExclusoes = total + deletionLog.length;
    const ativos = list.filter(v => v._status === 'ATIVO').length;
    const utilizados = list.filter(v => v._status === 'UTILIZADO').length;
    const expirados = list.filter(v => v._status === 'EXPIRADO').length;
    const excluidos = deletionLog.length;
    const taxaResgate = total > 0 ? ((utilizados / total) * 100).toFixed(1) : 0;
    const taxaExpiracao = total > 0 ? ((expirados / total) * 100).toFixed(1) : 0;
    const taxaExclusao = totalComExclusoes > 0 ? ((excluidos / totalComExclusoes) * 100).toFixed(1) : 0;
    const usados = list.filter(v => v._status === 'UTILIZADO' && v.usedTimestamp && v.issueTimestamp);
    const tempoMedio = usados.length > 0 ? (usados.reduce((s,v) => s + (v.usedTimestamp - v.issueTimestamp), 0) / usados.length / (24*60*60*1000)).toFixed(1) : null;
    const expirandoBreve = list.filter(v => { if (v._status !== 'ATIVO') return false; const d = daysUntilExpiry(v); return d !== null && d <= 30 && d > 0; });

    const monthlyEmission = {}, monthlyUse = {}, monthlyDeletion = {};
    list.forEach(v => {
      if (v.issueTimestamp) { const d = new Date(v.issueTimestamp); const k = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`; monthlyEmission[k] = (monthlyEmission[k]||0)+1; }
      if (v.usedTimestamp) { const d = new Date(v.usedTimestamp); const k = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`; monthlyUse[k] = (monthlyUse[k]||0)+1; }
    });
    deletionLog.forEach(l => {
      if (l.deletedTimestamp) { const d = new Date(l.deletedTimestamp); const k = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`; monthlyDeletion[k] = (monthlyDeletion[k]||0)+1; }
    });
    const allMonths = [...new Set([...Object.keys(monthlyEmission), ...Object.keys(monthlyUse), ...Object.keys(monthlyDeletion)])].sort().slice(-12);
    const maxMonthly = Math.max(1, ...allMonths.map(k => Math.max(monthlyEmission[k]||0, monthlyUse[k]||0, monthlyDeletion[k]||0)));

    const insights = [];
    if (taxaResgate >= 50) insights.push({ type: 'success', text: `Excelente engajamento: ${taxaResgate}% dos vouchers foram resgatados.` });
    else if (taxaResgate >= 25) insights.push({ type: 'warning', text: `Taxa de resgate moderada (${taxaResgate}%). Reforce a comunicação após emissão.` });
    else if (utilizados > 0) insights.push({ type: 'danger', text: `Taxa de resgate baixa (${taxaResgate}%).` });
    if (expirandoBreve.length > 0) insights.push({ type: 'warning', text: `${expirandoBreve.length} voucher(s) expira(m) em até 30 dias.` });
    if (expirados > 0 && taxaExpiracao > 30) insights.push({ type: 'danger', text: `${taxaExpiracao}% dos vouchers expiraram sem uso.` });
    if (tempoMedio !== null) insights.push({ type: 'success', text: `Tempo médio entre emissão e resgate: ${tempoMedio} dias.` });
    if (ativos > 0) insights.push({ type: 'success', text: `${ativos} voucher(s) ativo(s) no momento.` });
    if (excluidos > 0 && parseFloat(taxaExclusao) > 5) insights.push({ type: 'danger', text: `Taxa de exclusão alta (${taxaExclusao}%). Avalie causas frequentes nos motivos registrados.` });
    else if (excluidos > 0) insights.push({ type: 'warning', text: `${excluidos} voucher(s) já excluído(s) com justificativa registrada.` });

    container.innerHTML = `
      <div class="kpi-grid">
        <div class="kpi-card"><div class="kpi-label">Total Ativo na Base</div><div class="kpi-value">${total}</div><div class="kpi-sub">+ ${excluidos} excluídos</div></div>
        <div class="kpi-card green"><div class="kpi-label">Ativos</div><div class="kpi-value">${ativos}</div><div class="kpi-sub">${total>0?((ativos/total)*100).toFixed(1):0}% do total</div></div>
        <div class="kpi-card amber"><div class="kpi-label">Utilizados</div><div class="kpi-value">${utilizados}</div><div class="kpi-sub">Taxa de resgate: ${taxaResgate}%</div></div>
        <div class="kpi-card purple"><div class="kpi-label">Expirados</div><div class="kpi-value">${expirados}</div><div class="kpi-sub">${taxaExpiracao}% do total</div></div>
        <div class="kpi-card red"><div class="kpi-label">Excluídos</div><div class="kpi-value">${excluidos}</div><div class="kpi-sub">${taxaExclusao}% das emissões</div></div>
        <div class="kpi-card ${expirandoBreve.length>0?'red':''}"><div class="kpi-label">Expiram em 30d</div><div class="kpi-value">${expirandoBreve.length}</div><div class="kpi-sub">requerem lembrete</div></div>
        <div class="kpi-card green"><div class="kpi-label">Tempo Médio Resgate</div><div class="kpi-value">${tempoMedio!==null?tempoMedio:'—'}</div><div class="kpi-sub">${tempoMedio!==null?'dias após emissão':'sem dados ainda'}</div></div>
      </div>

      <div class="report-section">
        <h3>Distribuição de Status (base ativa)</h3>
        <div class="bar-row"><div class="bar-label">Ativos</div><div class="bar-track"><div class="bar-fill green" style="width:${total>0?(ativos/total)*100:0}%">${total>0?((ativos/total)*100).toFixed(1):0}%</div></div><div class="bar-value">${ativos}</div></div>
        <div class="bar-row"><div class="bar-label">Utilizados</div><div class="bar-track"><div class="bar-fill amber" style="width:${total>0?(utilizados/total)*100:0}%">${total>0?((utilizados/total)*100).toFixed(1):0}%</div></div><div class="bar-value">${utilizados}</div></div>
        <div class="bar-row"><div class="bar-label">Expirados</div><div class="bar-track"><div class="bar-fill purple" style="width:${total>0?(expirados/total)*100:0}%">${total>0?((expirados/total)*100).toFixed(1):0}%</div></div><div class="bar-value">${expirados}</div></div>
      </div>

      ${allMonths.length > 0 ? `<div class="report-section"><h3>Evolução Mensal — Emissão, Uso e Exclusões</h3>
        ${allMonths.map(k => { const emit=monthlyEmission[k]||0, use=monthlyUse[k]||0, del=monthlyDeletion[k]||0; const [y,m]=k.split('-'); const label=new Date(y,m-1,1).toLocaleDateString('pt-BR',{month:'short',year:'2-digit'});
          return `<div class="bar-row"><div class="bar-label">${label}</div>
            <div class="bar-track" style="display:flex;flex-direction:column;gap:2px;height:auto;background:transparent;">
              <div style="height:8px;background:#1e293b;border-radius:3px;"><div class="bar-fill" style="width:${(emit/maxMonthly)*100}%;height:100%;font-size:0;"></div></div>
              <div style="height:8px;background:#1e293b;border-radius:3px;"><div class="bar-fill amber" style="width:${(use/maxMonthly)*100}%;height:100%;font-size:0;"></div></div>
              <div style="height:8px;background:#1e293b;border-radius:3px;"><div class="bar-fill red" style="width:${(del/maxMonthly)*100}%;height:100%;font-size:0;"></div></div>
            </div><div class="bar-value" style="font-size:11px;">E:${emit} U:${use} X:${del}</div></div>`;}).join('')}
        <p style="font-size:11px;color:#94a3b8;margin-top:10px;">Azul: Emitidos &nbsp; Amarelo: Utilizados &nbsp; Vermelho: Excluídos</p></div>` : ''}

      ${expirandoBreve.length > 0 ? `<div class="report-section"><h3>Vouchers Expirando em Até 30 Dias</h3>
        <div class="table-container"><table>
          <thead><tr><th>Cliente</th><th>OS</th><th>Telefone</th><th>Expira em</th><th>Dias</th></tr></thead>
          <tbody>${expirandoBreve.sort((a,b)=>daysUntilExpiry(a)-daysUntilExpiry(b)).map(v=>`<tr><td>${v.clientName||'—'}</td><td>${v.osNumber}</td><td>${formatPhoneDisplay(v.clientPhone)}</td><td>${formatDate(v.expiryDate)}</td><td><span class="badge badge-warning">${daysUntilExpiry(v)} dias</span></td></tr>`).join('')}</tbody>
        </table></div></div>` : ''}

      ${deletionLog.length > 0 ? `<div class="report-section"><h3>Auditoria de Exclusões</h3>
        <p style="font-size:12px; color:#94a3b8; margin-bottom:14px;">Histórico permanente de vouchers excluídos com justificativa. Registro imutável.</p>
        <div class="table-container"><table>
          <thead><tr><th>OS</th><th>Cliente</th><th>Status anterior</th><th>Excluído em</th><th>Por</th><th>Justificativa</th></tr></thead>
          <tbody>${deletionLog.slice().sort((a,b)=>(b.deletedTimestamp||0)-(a.deletedTimestamp||0)).map(l=>`<tr>
            <td>${l.osNumber}</td>
            <td>${l.clientName || '—'}</td>
            <td><span class="badge badge-${l.previousStatus === 'ATIVO' ? 'active' : l.previousStatus === 'UTILIZADO' ? 'used' : 'expired'}">${l.previousStatus}</span></td>
            <td>${l.deletedAt}</td>
            <td>${l.deletedBy}</td>
            <td style="max-width:300px; font-size:12px; line-height:1.4;">${l.reason}</td>
          </tr>`).join('')}</tbody>
        </table></div></div>` : ''}

      <div class="report-section"><h3>Insights e Recomendações</h3>
        <ul class="insights-list">${insights.length>0?insights.map(i=>`<li class="${i.type}">${i.text}</li>`).join(''):'<li>Sem insights suficientes ainda.</li>'}</ul></div>

      <div class="report-section"><h3>Auditoria dos Dados</h3>
        <div style="font-size:12px;line-height:1.8;">
          <div>Vouchers ativos na base: <strong>${total}</strong></div>
          <div>Vouchers excluídos historicamente: <strong>${excluidos}</strong></div>
          <div>Total de emissões realizadas (incluindo excluídos): <strong>${totalComExclusoes}</strong></div>
          <div>Ativos + Utilizados + Expirados: <strong>${ativos+utilizados+expirados}</strong> ${(ativos+utilizados+expirados)===total?'(consistente)':'(divergência)'}</div>
          <div>Taxa de resgate = (${utilizados} / ${total}) × 100 = <strong>${taxaResgate}%</strong></div>
          <div>Taxa de exclusão = (${excluidos} / ${totalComExclusoes}) × 100 = <strong>${taxaExclusao}%</strong></div>
          <div>Validade aplicada: <strong>365 dias</strong> a partir da emissão</div>
        </div>
      </div>
    `;
  }
</script>
